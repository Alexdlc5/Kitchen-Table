name: web game at iPhone size
on:
  push:
    branches: [main]
  pull_request:
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - name: no ad SDK, no tracking, only permanent family-shareable purchases; the listing within Apple's limits once written
        run: node scripts/store-check.mjs
      - name: the app bundle builds and every import resolves
        run: node scripts/build-web.mjs
      - name: save mirror (localStorage <-> Preferences)
        run: node scripts/check-save-mirror.mjs
      - name: every screen and a whole hand of each game, WebKit + Chromium, no overlay during a hand, tap targets
        run: node scripts/smoke.mjs
      - name: the same on iPhone SE with Comfort mode on (64pt targets, 1.6x cards)
        run: node scripts/smoke.mjs --se --comfort
      - name: the same on iPad (bigger cards and type)
        run: node scripts/smoke.mjs --ipad
      - name: iPhone SE at Extra large text, with and without Comfort (what a phone set to Larger Text gets)
        run: node scripts/smoke.mjs --se --text xl && node scripts/smoke.mjs --se --comfort --text xl
      - name: cards razor sharp at 3x, edges and corner index 2 device px or less (WebKit + Chromium, Comfort off and on)
        run: node scripts/crisp.mjs --check 2
      - name: every card face, nothing in the middle touches a corner index (two- and four-colour decks)
        run: node scripts/check-cards.mjs && node scripts/check-cards.mjs --four
      - name: family table, two tabs over BroadcastChannel, same score, no desync, the guest leaving mid-hand
        run: node scripts/family-check.mjs
  soak:
    # 10 minutes of auto-played Hearts and Spades: no page error, frame work p95 under the 120 Hz budget (8.3 ms), heap growth under 25%
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/soak.mjs --minutes 10 --check
