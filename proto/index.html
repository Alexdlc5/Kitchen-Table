<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Kitchen Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<!-- the native splash stays up until the first screen has painted; this hides it anyway if the game never boots -->
<script>setTimeout(() => window.Capacitor?.Plugins?.SplashScreen?.hide(), 4000);</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="felt" aria-hidden="true"></div>
<div id="scene" aria-hidden="true"></div>
<div id="haze" aria-hidden="true"></div>
<main>
  <section id="title" class="screen" aria-label="Title"></section>
  <section id="picker" class="screen" aria-label="Games"></section>
  <section id="setup" class="screen" aria-label="Table setup"></section>
  <section id="table" class="screen" aria-label="Table">
    <header class="bar">
      <button id="menuBtn" class="pill" data-act="menu" aria-label="Menu"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5c4.5-.6 9.5-.4 14 0M3 10c4.5.4 9.5.3 14-.2M3 14.6c4.7-.5 9.3-.3 14 .2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Menu</span></button>
      <button id="readBtn" class="pill" data-act="read" aria-label="Read the table aloud" hidden><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path d="M13 7.5c1.3 1.4 1.3 3.6 0 5M15.4 5.4c2.4 2.6 2.4 6.6 0 9.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span>Read</span></button>
      <button id="scoreChip" class="pill" data-act="peek" aria-label="Score"></button>
    </header>
    <div id="seats"></div>
    <div id="trick"></div>
    <div id="center"></div>
    <div id="trump"></div>
    <div id="peek" class="paper" hidden></div>
    <div id="hand" role="group" aria-label="Your hand"></div>
    <div id="handoff" hidden></div>
  </section>
  <section id="sheet" class="screen" aria-label="Score sheet"></section>
  <section id="results" class="screen" aria-label="Results"></section>
  <section id="options" class="screen" aria-label="Options"></section>
  <section id="caregiver" class="screen" aria-label="Caregiver"></section>
  <section id="stats" class="screen" aria-label="Fair deal"></section>
  <section id="unlock" class="screen" aria-label="Unlock everything"></section>
  <section id="howto" class="screen" aria-label="How to play"></section>
  <section id="shop" class="screen" aria-label="Table shop"></section>
  <section id="boards" class="screen" aria-label="Leaderboards"></section>
</main>
<div id="announce" class="vh" aria-live="polite" aria-atomic="true"></div>
<div id="dialog" class="dialog" role="dialog" aria-modal="true" hidden><div class="paper" id="dialogBody"></div></div>
<script type="module" src="main.js"></script>
</body>
</html>
